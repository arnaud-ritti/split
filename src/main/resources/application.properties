spring.application.name=split

# No spring.datasource.* here on purpose: the datasource is supplied by
# Testcontainers via @ServiceConnection. Run the app with
#   ./mvnw spring-boot:test-run   (entry point: TestSplitApplication)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# There is no user to authenticate, so the in-memory one (and the generated password
# it logs on every start) is just noise. SecurityConfig permits every request anyway.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.analytics-enabled=false
